name: Check AgentSkills.io upstream

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "00-index.md"
      - "sources.json"
      - "LICENSE"
      - "LICENSE-DOCS"
      - "*.md"
      - "scripts/sync_agentskills.py"
      - "tests/test_sync_preservation.py"
      - ".github/workflows/check-agentskills-upstream.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    name: Read-only mirror check
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.result.outputs.changed }}
      proposal_allowed: ${{ steps.result.outputs.proposal_allowed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Test preservation safeguards
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compare published documentation with local mirror
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_agentskills.py --check --json | tee sync-result.json

      - name: Read comparison result
        id: result
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("sync-result.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={str(bool(result['changed'])).lower()}\n")
              output.write(f"proposal_allowed={str(result['proposal_allowed']).lower()}\n")
          blockers = result["preservation_blockers"]
          if blockers:
              print("::warning::Preservation review required; automated proposal blocked.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Preservation audit\n\n")
              summary.write("**Proposal allowed:** " + str(result["proposal_allowed"]) + "\n\n")
              for blocker in blockers:
                  summary.write("- " + blocker + "\n")
          PY

  propose-update:
    name: Prepare review-gated update
    needs: check
    if: github.event_name != 'pull_request' && needs.check.outputs.proposal_allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out canonical branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - name: Regenerate changed mirror content
        env:
          AGENTSKILLS_SYNC_WRITE: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_agentskills.py --write --json

      - name: Verify proposed changes exist
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit proposed update
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C agentskills-upstream-update
          git add --all
          git commit -m "docs: sync AgentSkills.io documentation"
          git push --force-with-lease origin HEAD:agentskills-upstream-update

      - name: Open or retain review pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --base main --head agentskills-upstream-update --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head agentskills-upstream-update \
              --title "docs: sync AgentSkills.io documentation" \
              --body "Automated proposed update generated from the official AgentSkills.io canonical Markdown after upstream documentation change detection. No automatic merge is configured; Director review is required."
          else
            echo "Existing review PR #$existing updated by branch push."
          fi
